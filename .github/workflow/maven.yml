name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        run: mvn package

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: maven-jar
          path: target/*.jar